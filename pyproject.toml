[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "furiosa-build-release-lab"
version = "0.1.0"
description = "A C++/CMake build and release lab with pybind11 Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YoungSeong Park" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DFASTMATH_BUILD_TESTS=OFF"]
wheel.packages = ["src/fastmath"]
sdist.include = [
  "CMakeLists.txt",
  "CHANGELOG.md",
  "Dockerfile",
  ".dockerignore",
  "apps/**",
  "cpp/**",
  "python/**",
  "cmake/**",
  "src/**",
  "tests/**",
]

[tool.cibuildwheel]
build = [
  "cp310-manylinux_x86_64",
  "cp311-manylinux_x86_64",
  "cp312-manylinux_x86_64",
  "cp313-manylinux_x86_64",
]
archs = ["x86_64"]
build-frontend = "build"
build-verbosity = 1
test-command = "python {project}/tests/python/test_fastmath.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
