name: Multi-environment Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == gcc ]]; then
            echo "CC=gcc" >>"${GITHUB_ENV}"
            echo "CXX=g++" >>"${GITHUB_ENV}"
          else
            echo "CC=clang" >>"${GITHUB_ENV}"
            echo "CXX=clang++" >>"${GITHUB_ENV}"
          fi

      - name: Configure native library
        run: >-
          cmake -S . -B build/compatibility
          -DFASTMATH_BUILD_PYTHON=OFF
          -DFASTMATH_BUILD_TESTS=ON
          -DFASTMATH_BUILD_NATIVE_PACKAGE=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${PWD}/install"

      - name: Build and test
        run: |
          cmake --build build/compatibility --parallel 2
          ctest --test-dir build/compatibility --output-on-failure
          cmake --install build/compatibility

      - name: Build external CMake consumer
        run: |
          cmake -S tests/consumer -B build/consumer \
            -DCMAKE_PREFIX_PATH="${PWD}/install"
          cmake --build build/consumer --parallel 2
          ./build/consumer/fastmath_consumer

  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build, install, and test wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m pip install --force-reinstall dist/*.whl
          cd tests/python
          python test_fastmath.py

  report:
    name: Compatibility report
    needs: [native, python]
    runs-on: ubuntu-24.04
    steps:
      - name: Create report
        run: |
          cat >compatibility-report.md <<'EOF'
          # Multi-environment compatibility report

          Result: **PASS**

          - Native: Ubuntu 22.04 and 24.04 with GCC and Clang
          - Python: CPython 3.10-3.13 across supported Ubuntu runners
          - Checks: C++ tests, install tree, external CMake consumer, wheel install
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ github.sha }}
          path: compatibility-report.md
          if-no-files-found: error
          retention-days: 30
