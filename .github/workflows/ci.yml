name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build/cpp
          -DFASTMATH_BUILD_PYTHON=OFF
          -DFASTMATH_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cpp --parallel

      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure

  python:
    name: Python ${{ matrix.python-version }} package test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build native wheel
        run: python -m build --wheel --outdir dist

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Test installed package
        working-directory: tests/python
        run: python test_fastmath.py

