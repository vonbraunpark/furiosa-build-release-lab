name: Container Alias Rollback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only or apply the alias rollback"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      release_tag:
        description: "Known-good immutable release, for example v0.1.0"
        required: true
        type: string
      target_digest:
        description: "Known-good sha256 digest recorded in that release"
        required: true
        type: string
      aliases:
        description: "Space-separated floating aliases, for example latest 1 1.2"
        required: true
        default: latest
        type: string
      confirmation:
        description: "For apply, enter ROLLBACK followed by the tag"
        required: false
        type: string

permissions:
  attestations: read
  contents: read
  packages: write

concurrency:
  group: container-alias-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: release-rollback
    steps:
      - name: Check out rollback tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate apply confirmation
        if: inputs.mode == 'apply'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "${CONFIRMATION}" = "ROLLBACK ${RELEASE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify target and process aliases
        env:
          ALIASES: ${{ inputs.aliases }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
        run: |
          read -r -a alias_list <<<"${ALIASES}"
          ./scripts/rollback_container_aliases.sh \
            "${MODE}" "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" \
            "${IMAGE}" "${TARGET_DIGEST}" "${alias_list[@]}" |
            tee rollback-record.md

      - name: Upload rollback record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-${{ inputs.mode }}-${{ inputs.release_tag }}-${{ github.run_id }}
          path: rollback-record.md
          if-no-files-found: warn
          retention-days: 90
