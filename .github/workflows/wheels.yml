name: Manylinux Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-manylinux-wheels:
    name: CPython 3.10-3.13 / manylinux_2_28 / x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build host Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build and test manylinux wheels
        run: python -m cibuildwheel --platform linux --output-dir wheelhouse

      - name: Show wheel artifacts
        run: python -c "from pathlib import Path; print(*sorted(Path('wheelhouse').glob('*.whl')), sep='\n')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fastmath-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
