name: Release Disaster Recovery Drill

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag; empty selects the latest stable release"
        required: false
        type: string

permissions:
  attestations: read
  contents: read
  packages: read

concurrency:
  group: disaster-recovery-drill
  cancel-in-progress: false

jobs:
  verify-recovery:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release under test
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${REQUESTED_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Rehydrate and verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./scripts/verify_disaster_recovery.sh
          "${GITHUB_REPOSITORY}"
          "${{ steps.release.outputs.tag }}"
          disaster-recovery-report.md

      - name: Upload recovery report
        uses: actions/upload-artifact@v7
        with:
          name: disaster-recovery-${{ steps.release.outputs.tag }}-${{ github.run_id }}
          path: disaster-recovery-report.md
          if-no-files-found: error
          retention-days: 30
